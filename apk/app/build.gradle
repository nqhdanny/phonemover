plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phonemover.importer'
    compileSdk 36

    defaultConfig {
        applicationId "com.phonemover.importer"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external runtime dependencies — uses only the Android framework.
}
